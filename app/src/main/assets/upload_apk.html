<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport"content="width=device-width, initial-scale=1.0"><title>PSA工具箱 APP远程安装</title><link rel="stylesheet"type="text/css"href="css/style.css"></head><body class="page-bg-2"><div class="container"><h1>PSA工具箱 APP远程安装</h1><form id="uploadForm"enctype="multipart/form-data"method="post"><button type="button"onclick="handleButtonClick()">选择并上传应用</button><input type="file"id="fileInput"name="file"accept=".apk,.1"onchange="handleFileSelect(event)"><input type="submit"value="上传并安装"style="display: none;"></form><div class="progress-container"id="progressContainer"><div class="progress-bar"id="progressBar"></div></div><div id="progressText"></div><div id="uploadSuccess">应用上传成功，正在后台尝试安装</div><div id="instructions">支持上传 .apk 或微信/QQ接收的 .1 后缀文件</div></div><footer>&copy;<span id="currentYear"></span>bandwa-Copyright All Rights Reserved</footer><script>document.getElementById('currentYear').textContent=new Date().getFullYear();function handleButtonClick(){document.getElementById('fileInput').click()}function handleFileSelect(event){const input=event.target;const selectedFile=input.files[0];if(selectedFile){const fileName=selectedFile.name.toLowerCase();if(!fileName.endsWith('.apk')&&!fileName.endsWith('.1')){alert('请选择 APK 或 .1 格式的文件！');input.value='';return}alert('已开始上传: '+selectedFile.name);uploadFile(selectedFile)}input.value=''}function uploadFile(file){const formData=new FormData();formData.append('file',file);const xhr=new XMLHttpRequest();xhr.open('POST','/upload-apk',true);const progressContainer=document.getElementById('progressContainer');const progressBar=document.getElementById('progressBar');const progressText=document.getElementById('progressText');const uploadSuccess=document.getElementById('uploadSuccess');progressContainer.style.display='block';uploadSuccess.style.display='none';xhr.upload.onprogress=function(e){if(e.lengthComputable){const percentComplete=(e.loaded/e.total)*100;progressBar.style.width=percentComplete+'%';progressText.textContent='正在上传: '+Math.round(percentComplete)+'%'}};xhr.onload=function(){if(xhr.status===200){console.log('Server response:',xhr.responseText);uploadSuccess.style.display='block';progressText.textContent='上传完成'}else{alert('上传失败: '+xhr.status)}};xhr.onerror=function(){alert('上传过程中发生错误')};xhr.send(formData)}</script></body></html>
