<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport"content="width=device-width, initial-scale=1.0"><title>PSA工具箱桌面背景替换</title><link rel="stylesheet"type="text/css"href="css/style.css"></head><body class="page-bg-1"><div class="container"><h1>PSA工具箱桌面背景替换</h1><form id="uploadForm"enctype="multipart/form-data"method="post"><button type="button"onclick="handleButtonClick()">选择并上传图片</button><input type="file"id="fileInput"name="file"accept="image/*"onchange="handleFileSelect(event)"><input type="submit"value="上传文件"style="display: none;"></form><div class="progress-container"id="progressContainer"><div class="progress-bar"id="progressBar"></div></div><div id="progressText"></div><div id="uploadSuccess">上传背景图片成功</div><div id="instructions">请上传分辨率接近1920*720的图片，本工具会自动拉伸为1920*720分辨率</div></div><footer>&copy;<span id="currentYear"></span>bandwa-Copyright All Rights Reserved</footer><script>document.getElementById('currentYear').textContent=new Date().getFullYear();function handleButtonClick(){document.getElementById('fileInput').click()}function handleFileSelect(event){const input=event.target;const selectedFile=input.files[0];if(selectedFile){alert('已选择文件: '+selectedFile.name);resizeAndUpload(selectedFile)}input.value=''}function resizeAndUpload(file){const targetWidth=1920;const targetHeight=720;const img=new Image();img.onload=function(){const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');canvas.width=targetWidth;canvas.height=targetHeight;ctx.drawImage(img,0,0,targetWidth,targetHeight);canvas.toBlob(blob=>{const formData=new FormData();formData.append('file',blob,file.name);const xhr=new XMLHttpRequest();xhr.open('POST','/upload',true);const progressContainer=document.getElementById('progressContainer');const progressBar=document.getElementById('progressBar');const progressText=document.getElementById('progressText');const uploadSuccess=document.getElementById('uploadSuccess');progressContainer.style.display='block';uploadSuccess.style.display='none';xhr.upload.onprogress=function(e){if(e.lengthComputable){const percentComplete=(e.loaded/e.total)*100;progressBar.style.width=percentComplete+'%';progressText.textContent='正在上传: '+Math.round(percentComplete)+'%'}};xhr.onload=function(){if(xhr.status===200){console.log('Server response:',xhr.responseText);uploadSuccess.style.display='block';progressText.textContent='上传完成'}else{alert('上传失败: '+xhr.status)}};xhr.onerror=function(){alert('上传过程中发生错误')};xhr.send(formData)},file.type)};const reader=new FileReader();reader.onload=function(e){img.src=e.target.result};reader.readAsDataURL(file)}</script></body></html>
