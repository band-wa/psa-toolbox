<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport"content="width=device-width, initial-scale=1.0"><title>PSA工具箱自定义脚本</title><link rel="stylesheet"type="text/css"href="css/style.css"></head><body class="page-bg-3"><div class="container"><h1>PSA工具箱自定义脚本</h1><label for="scriptInput"style="color: white; font-size: 18px;">支持sh格式的shell脚本</label><textarea id="scriptInput"rows="10"cols="50"placeholder="#!/system/bin/sh">{{scriptContent}}</textarea><button id="saveScriptButton"onclick="saveScript()">保存脚本</button><div class="progress-container"id="progressContainer"><div class="progress-bar"id="progressBar"></div></div><div id="progressText"></div><div id="saveSuccess"style="display:none; color: white; margin-top: 10px;">脚本保存成功！</div><footer>&copy;<span id="currentYear"></span>bandwa-Copyright All Rights Reserved</footer></div><script>document.getElementById('currentYear').textContent=new Date().getFullYear();function saveScript(){const scriptContent=document.getElementById('scriptInput').value;if(scriptContent.trim()===""){alert("脚本内容不能为空！");return}const formData=new FormData();const blob=new Blob([scriptContent],{type:"text/javascript"});formData.append('file',blob,'uploaded_script.js');const xhr=new XMLHttpRequest();xhr.open('POST','/upload-script',true);const progressContainer=document.getElementById('progressContainer');const progressBar=document.getElementById('progressBar');const progressText=document.getElementById('progressText');const saveSuccess=document.getElementById('saveSuccess');progressContainer.style.display='block';saveSuccess.style.display='none';xhr.upload.onprogress=function(e){if(e.lengthComputable){const percentComplete=(e.loaded/e.total)*100;progressBar.style.width=percentComplete+'%';progressText.textContent='正在保存: '+Math.round(percentComplete)+'%'}};xhr.onload=function(){if(xhr.status===200){console.log('Server response:',xhr.responseText);saveSuccess.style.display='block';progressText.textContent='保存完成'}else{alert('保存失败: '+xhr.status)}};xhr.onerror=function(){alert('保存过程中发生错误')};xhr.send(formData)}</script></body></html>
